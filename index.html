<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaseMeme Launchpad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="p-4 flex justify-between items-center border-b border-slate-800">
        <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
            BaseMeme Launchpad
        </h1>
        <button id="connect-btn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-xl font-medium transition">
            Connect Wallet
        </button>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl w-full max-w-md shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-center">Deploy Your Meme Token</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Token Name</label>
                    <input type="text" id="token-name" placeholder="My Meme" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Token Symbol</label>
                    <input type="text" id="token-symbol" placeholder="MEME" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Total Supply</label>
                    <input type="number" id="token-supply" placeholder="1000000" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-white focus:outline-none focus:border-blue-500">
                </div>
                <button id="deploy-btn" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-semibold transition mt-2">
                    Deploy Token
                </button>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-900">
        Base Sepolia Testnet (<span id="wallet-status">Not Connected</span>)
    </footer>

    <script>
        const contractAddress = '0x7fcf3673f721c537AE7104a6FF622B3359Cf34C5';
        let provider = null;
        let signer = null;

        const connectBtn = document.getElementById('connect-btn');
        const walletStatus = document.getElementById('wallet-status');

        connectBtn.addEventListener('click', async () => {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    connectBtn.textContent = address.substring(0, 6) + '...' + address.substring(38);
                    walletStatus.textContent = 'Connected: ' + address.substring(0, 6) + '...';
                } catch (err) {
                    console.error(err);
                    alert("Connection failed: " + err.message);
                }
            } else {
                alert("No crypto wallet found!");
            }
        });

        document.getElementById('deploy-btn').addEventListener('click', async () => {
            if (!signer) {
                alert("Connect wallet first!");
                return;
            }
            const name = document.getElementById('token-name').value;
            const symbol = document.getElementById('token-symbol').value;
            const supply = document.getElementById('token-supply').value;

            if (!name || !symbol || !supply) {
                alert("Fill in all fields!");
                return;
            }
            alert("Кошелек подключен! Контракт: " + contractAddress);
        });
    </script>
</body>
</html>
